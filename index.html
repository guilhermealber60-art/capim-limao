<style>
:root{
  --paper:#F5F6EF; --surface:#FFFFFF; --ink:#1E2B1F; --muted:#5E6A5C; --line:#DCE0CF;
  --capim:#2F4A2F; --on-capim:#F5F6EF; --folha:#6F8F3F; --limao:#E4EBC0; --on-limao:#2F4A2F;
  --fita:#B8646E; --erro:#A63D3D; --shadow:0 1px 2px rgba(30,43,31,.08),0 8px 24px rgba(30,43,31,.08);
  --serif:"Young Serif",Georgia,"Times New Roman",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hand:"Caveat","Segoe Script","Bradley Hand",cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141A14; --surface:#1C241C; --ink:#E9EDE2; --muted:#A2AD9C; --line:#2F3B2F;
    --capim:#B5CF84; --on-capim:#142014; --folha:#A6C27A; --limao:#34422A; --on-limao:#E4EBC0;
    --fita:#E0939C; --erro:#E68A8A; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#141A14; --surface:#1C241C; --ink:#E9EDE2; --muted:#A2AD9C; --line:#2F3B2F;
  --capim:#B5CF84; --on-capim:#142014; --folha:#A6C27A; --limao:#34422A; --on-limao:#E4EBC0;
  --fita:#E0939C; --erro:#E68A8A; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.55 var(--sans)}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--folha);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 1.1rem}

/* Cabeçalho */
.hero{padding:2.4rem 0 1.4rem}
.hero .wrap{display:grid;gap:.9rem}
.brand{display:flex;align-items:flex-end;gap:.7rem}
.brand svg{width:44px;height:64px;flex:none;color:var(--folha)}
.brand h1{font:400 clamp(2.4rem,9vw,3.6rem)/.95 var(--serif);margin:0;color:var(--capim);letter-spacing:-.01em}
.brand .sub{display:block;font:500 1rem/1.2 var(--sans);color:var(--muted);letter-spacing:.02em;margin-top:.35rem}
.intro{margin:0;max-width:38ch;color:var(--muted);font-size:1.02rem}
.aviso{display:inline-flex;gap:.5rem;align-items:center;background:var(--limao);color:var(--on-limao);border-radius:999px;padding:.4rem .85rem;font-size:.88rem;font-weight:500;width:fit-content}

/* Categorias */
.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.cats .wrap{display:flex;gap:.45rem;overflow-x:auto;padding-top:.6rem;padding-bottom:.6rem;scrollbar-width:none}
.cats .wrap::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.5rem .95rem;font-weight:500;font-size:.93rem;cursor:pointer;min-height:40px}
.chip[aria-current="true"]{background:var(--capim);color:var(--on-capim);border-color:var(--capim)}

/* Produtos */
main{padding-bottom:7rem}
.secao{padding-top:1.8rem}
.secao h2{font:400 1.55rem/1.2 var(--serif);margin:0 0 1rem;color:var(--capim)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.1rem .85rem}
@media (min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:1.6rem 1.2rem}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{all:unset;display:flex;flex-direction:column;gap:.55rem;cursor:pointer;min-width:0}
.card:focus-visible{outline:2px solid var(--folha);outline-offset:4px;border-radius:14px}
.foto{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:var(--limao)}
.foto img{width:100%;height:100%;object-fit:cover}
.foto.contem{background:#fff}
.foto.contem img{object-fit:contain}
.card .foto .tag{position:absolute;left:.5rem;bottom:.6rem}
.card h3{font:600 1rem/1.25 var(--sans);margin:0}
.card p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.4}
.indisp .foto img{filter:grayscale(.8) opacity(.6)}
.selo{position:absolute;top:.5rem;right:.5rem;background:var(--surface);color:var(--ink);font-size:.75rem;font-weight:600;padding:.2rem .55rem;border-radius:999px}

/* Etiqueta de preço: o elemento-assinatura, uma tag de presente com furo e cordão */
.tag{--h:34px;display:inline-flex;align-items:center;height:var(--h);padding:0 .8rem 0 1.35rem;background:var(--limao);color:var(--on-limao);font:600 .95rem/1 var(--sans);
  clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%);position:relative;transform:rotate(-3deg);filter:drop-shadow(0 2px 3px rgba(0,0,0,.18));white-space:nowrap}
.tag::before{content:"";position:absolute;left:9px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--fita)}
.tag.lg{--h:42px;font-size:1.15rem;padding-left:1.6rem}

/* Barra da sacola */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom,0px));pointer-events:none}
.bar button{pointer-events:auto;display:flex;justify-content:space-between;align-items:center;width:100%;max-width:560px;margin:0 auto;border:0;border-radius:16px;background:var(--capim);color:var(--on-capim);padding:1rem 1.2rem;font-weight:600;font-size:1rem;box-shadow:var(--shadow);cursor:pointer;min-height:56px}
.bar[hidden]{display:none}
.bar .n{background:var(--on-capim);color:var(--capim);border-radius:999px;min-width:1.6rem;height:1.6rem;display:inline-grid;place-items:center;font-size:.85rem;margin-right:.6rem}

footer{padding:2rem 0 1rem;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);margin-top:2.5rem}
footer .wrap{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center}
.link{background:none;border:0;padding:.4rem 0;color:var(--capim);font-weight:600;text-decoration:none;cursor:pointer;font-size:.9rem;min-height:44px;display:inline-flex;align-items:center}

/* Camada (bottom sheet) */
.layer{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.layer[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(10,16,10,.5)}
.sheet{position:relative;background:var(--paper);width:100%;max-width:620px;max-height:calc(100% - env(safe-area-inset-top,0px) - 1.2rem);border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:sobe .28s cubic-bezier(.2,.8,.2,1)}
@media (min-width:720px){.layer{align-items:center}.sheet{border-radius:22px;max-height:88%}}
@keyframes sobe{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem 1.1rem;border-bottom:1px solid var(--line)}
.sheet-top h2{font:400 1.3rem/1.2 var(--serif);margin:0;color:var(--capim)}
.x{border:0;background:var(--surface);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none;border:1px solid var(--line)}
.sheet-body{overflow-y:auto;padding:1.1rem;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:.85rem 1.1rem calc(.85rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--paper);display:grid;gap:.5rem}

.pfoto{margin:-1.1rem -1.1rem 1rem;aspect-ratio:4/3;background:var(--limao);position:relative}
.pfoto img{width:100%;height:100%;object-fit:cover}
.pfoto .tag{position:absolute;left:1rem;bottom:-14px}
.pnome{font:400 1.7rem/1.15 var(--serif);margin:1.4rem 0 .3rem;color:var(--capim)}
.presumo{margin:0 0 1.2rem;color:var(--muted)}
.desc{margin:0;max-width:60ch;line-height:1.6}
h4{font:600 .95rem/1.3 var(--sans);margin:1.3rem 0 .5rem}
.itens{margin:0;padding:0;list-style:none;display:grid;gap:.3rem}
.itens li{padding-left:1.1rem;position:relative}
.itens li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--folha)}
.opts{display:flex;flex-wrap:wrap;gap:.5rem}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:.6rem 1rem;cursor:pointer;min-height:44px;font-weight:500}
.opt[aria-pressed="true"]{border-color:var(--capim);background:var(--limao);color:var(--on-limao)}
.qtd{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.qtd button{border:0;background:none;width:44px;height:44px;font-size:1.3rem;cursor:pointer}
.qtd span{min-width:2rem;text-align:center;font-weight:600}

/* Cartão escrito à mão */
.cartao{margin-top:.6rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1rem 1.1rem;transform:rotate(-1deg);box-shadow:var(--shadow);position:relative}
.cartao::after{content:"";position:absolute;top:-6px;right:18px;width:34px;height:12px;background:var(--fita);opacity:.75;border-radius:2px;transform:rotate(4deg)}
.cartao p{margin:0;font:500 1.45rem/1.2 var(--hand);color:var(--ink);min-height:1.8rem;white-space:pre-wrap;overflow-wrap:anywhere}
.cartao p.vazio{color:var(--muted);opacity:.7}
.cartao small{display:block;text-align:right;color:var(--muted);font-size:.75rem;margin-top:.3rem}

/* Formulários */
label{display:block;font-weight:600;font-size:.92rem;margin:.9rem 0 .35rem}
label .opc{font-weight:400;color:var(--muted)}
input[type=text],input[type=tel],input[type=date],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:.75rem .85rem;min-height:48px;font-size:1rem}
textarea{resize:vertical;min-height:84px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--folha)}
.inv{border-color:var(--erro)!important}
.err{color:var(--erro);font-size:.85rem;margin:.3rem 0 0}
.dica{color:var(--muted);font-size:.85rem;margin:.3rem 0 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 .7rem}
.row .w{grid-column:1/-1}
fieldset{border:0;margin:0 0 1.6rem;padding:0}
legend{font:400 1.2rem/1.2 var(--serif);color:var(--capim);padding:0;display:flex;align-items:center;gap:.55rem}
legend .num{display:inline-grid;place-items:center;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--limao);color:var(--on-limao);font:600 .85rem var(--sans)}
.check{display:flex;gap:.65rem;align-items:flex-start;margin:.9rem 0 0;font-weight:500;cursor:pointer}
.check input{width:22px;height:22px;flex:none;margin:.05rem 0 0;accent-color:var(--capim)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.seg .opt{text-align:left}
.seg .opt small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}

.btn{display:flex;align-items:center;justify-content:center;gap:.5rem;border:0;border-radius:14px;background:var(--capim);color:var(--on-capim);padding:.95rem 1.2rem;font-weight:600;font-size:1rem;cursor:pointer;min-height:52px;text-decoration:none;width:100%}
.btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.wa{background:#1F7A4D;color:#fff}
.btn[disabled]{opacity:.6;cursor:progress}

/* Sacola e revisão */
.linha{display:grid;grid-template-columns:64px 1fr auto;gap:.8rem;padding:.9rem 0;border-bottom:1px solid var(--line);align-items:start}
.linha img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.linha > strong{white-space:nowrap}
.linha > strong.comb{white-space:normal;text-align:right;font-size:.85rem;max-width:5.5rem}
.linha h3{font:600 .98rem/1.3 var(--sans);margin:0}
.linha .meta{color:var(--muted);font-size:.85rem;margin:.15rem 0 0}
.linha .msg{font:500 1.15rem/1.15 var(--hand);margin:.3rem 0 0}
.linha .acts{display:flex;align-items:center;gap:.4rem;margin-top:.45rem}
.linha .acts .qtd button{width:36px;height:36px}
.rm{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:.4rem}
.tot{display:grid;gap:.35rem;padding:1rem 0}
.tot div{display:flex;justify-content:space-between;gap:1rem}
.tot div span:last-child{text-align:right}
.tot .big{font-weight:700;font-size:1.1rem}
.vazio-box{text-align:center;padding:2.5rem 1rem;color:var(--muted)}
.resumo dl{display:grid;grid-template-columns:auto 1fr;gap:.35rem .9rem;margin:0}
.resumo dt{color:var(--muted);font-size:.9rem}
.resumo dd{margin:0;font-weight:500;overflow-wrap:anywhere}

/* Confirmação */
.ok{text-align:center;padding:1rem 0 .5rem}
.ok .numero{font:400 2.4rem/1 var(--serif);color:var(--capim);margin:.4rem 0 .6rem}
.ok p{color:var(--muted);margin:.3rem auto;max-width:34ch}
pre.previa{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem;font:400 .85rem/1.45 var(--sans);margin:1rem 0 0;overflow-wrap:anywhere}

/* Painel */
.pedido{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:.9rem 1rem;margin-bottom:.8rem}
.pedido header{display:flex;justify-content:space-between;gap:.6rem;align-items:baseline;flex-wrap:wrap}
.pedido strong{font:400 1.2rem var(--serif);color:var(--capim)}
.pedido .meta{color:var(--muted);font-size:.85rem}
.pedido select{min-height:40px;padding:.4rem .6rem;width:auto;font-size:.9rem}
.pedido details{margin-top:.5rem}
.pedido summary{cursor:pointer;color:var(--muted);font-size:.88rem;min-height:32px}
.st{font-size:.78rem;font-weight:600;padding:.15rem .55rem;border-radius:999px;background:var(--limao);color:var(--on-limao)}
.demo{background:var(--limao);color:var(--on-limao);border-radius:12px;padding:.8rem 1rem;font-size:.88rem;margin-bottom:1rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

<header class="hero">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 44 64" aria-hidden="true"><path d="M22 63C21 44 12 30 3 22c10 4 16 12 19 22 1-17 7-31 19-43-6 14-9 31-8 49" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M22 63c1-8 5-15 11-19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>

/* Cardápio de setembro/2026. Somente nome, frase, composição e preço de venda.
   preco: null = item sob orçamento (valor combinado pelo WhatsApp). */

const PRODUTOS = [
  { id:"capim-limao", cat:"cafes", nome:"Capim Limão", preco:139.90, frase:"Um café da manhã cheio de afeto.",
    descricao:"1 Starbucks Frappuccino Café Mocha, 2 croissants, 2 pães de queijo, biscoitos amanteigados sortidos, 2 Ferrero Rocher, 3 morangos e uvas verdes. Acompanha Polenguinho, mussarela, salame, geleia e Nutella. Em caixa kraft com laço." },
  { id:"erva-doce", cat:"cafes", nome:"Erva-Doce", preco:169.90, frase:"Um café com um toque especial.",
    descricao:"Suco de laranja integral, 1 café Baggio Drip Coffee e 1 chá de morango. 2 croissants, 4 pães de queijo, 2 waffles, 5 morangos, uvas verdes, 5 casadinhos de goiabada e 1 Ferrero Rocher. Com Polenguinho, mussarela, salame, peito de frango defumado, geleia e Nutella. Em caixa kraft com laço." },
  { id:"alecrim-partilhar", cat:"cafes", nome:"Alecrim para Partilhar", preco:319.90, frase:"Feita para dividir com alguém especial.",
    descricao:"Mini bolo de laranja com morangos, 2 croissants, 5 pães de queijo, 2 waffles, 2 stroopwafels, cerca de 10 amanteigados, 2 casadinhos, 6 torradas e 3 biscoitos Nestlé com chocolate. Aproximadamente 250 g de uvas, 5 morangos, 100 g de queijo e 60 g de salame, além de tomates-cereja, alecrim e 3 palitos salgados. Suco de laranja de 500 ml e 2 cafés Baggio. Em bandeja de madeira, com flores e laço.",

/* Categoria ativa: fica verde a que foi tocada e acompanha a rolagem */
let travado = false, tTrava = null;
function ativaCategoria(id){
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-current", c.dataset.cat === id ? "true" : "false"));
  const chip = document.querySelector(`.chip[data-cat="${id}"]`), barra = $("#cats");
  if (chip && barra.scrollWidth > barra.clientWidth){
    const alvo = chip.offsetLeft - (barra.clientWidth - chip.offsetWidth) / 2;
    barra.scrollTo({ left: Math.max(0, alvo), behavior: "smooth" });
  }
}
function liberaTrava(){ travado = false; clearTimeout(tTrava); }
$("#cats").addEventListener("click", e => { const b = e.target.closest("[data-cat]"); if (!b) return;
  ativaCategoria(b.dataset.cat);
  travado = true; clearTimeout(tTrava); tTrava = setTimeout(liberaTrava, 1500);
  document.getElementById("cat-" + b.dataset.cat).scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); });

let rafCat = 0;
function categoriaPelaRolagem(){
  rafCat = 0; if (travado) return;
  const secoes = [...document.querySelectorAll(".secao")]; if (!secoes.length) return;
  const limite = $(".cats").getBoundingClientRect().bottom + 24;
  let atual = secoes[0];
  secoes.forEach(s => { if (s.getBoundingClientRect().top <= limite) atual = s; });
  const fim = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
  if (fim && window.scrollY > 0) atual = secoes[secoes.length - 1];
  const id = atual.id.replace("cat-", "");
  if (document.querySelector('.chip[aria-current="true"]')?.dataset.cat !== id) ativaCategoria(id);
}
window.addEventListener("scroll", () => { if (!rafCat) rafCat = requestAnimationFrame(categoriaPelaRolagem); }, { passive: true });
window.addEventListener("scrollend", () => { if (travado) setTimeout(liberaTrava, 50); });
["wheel","touchstart","keydown"].forEach(ev => window.addEventListener(ev, e => { if (ev !== "keydown" || ["ArrowUp","ArrowDown","PageUp","PageDown","Home","End"," "].includes(e.key)) liberaTrava(); }, { passive: true }));

      ${(p.textos || []).map((x,xi) => `<h4><label for="txt${xi}" style="margin:0;font-size:inherit">${esc(x.nome)}${x.obrigatorio ? "" : ' <span class="opc">(opcional)</span>'}</label></h4><input type="text" id="txt${xi}" data-x="${xi}" maxlength="${x.max || 60}" placeholder="${esc(x.placeholder || "")}"><p class="err" id="txtErr${xi}" hidden>Preencha este campo para continuar.</p>`).join("")}
      ${p.semCartao ? "" : `<h4><label for="msgCartao" style="margin:0;font-size:inherit">Mensagem do cartão <span class="opc">(opcional)</span></label></h4>
      <textarea id="msgCartao" maxlength="200" placeholder="Ex.: Feliz aniversário, mãe! Com todo o carinho."></textarea>
      <div class="cartao" aria-hidden="true"><p class="vazio" id="cartaoPrev">Sua mensagem aparece aqui</p><small><span id="cont">0</span>/200</small></div>`}
      <h4>Quantidade</h4>
      <div class="qtd"><button type="button" data-q="-1" aria-label="Diminuir">−</button><span id="qv">1</span><button type="button" data-q="1" aria-label="Aumentar">+</button></div>
    </div>
    <div class="sheet-foot"><button class="btn" type="button" id="add" ${off ? "disabled" : ""}>${off ? "Indisponível no momento" : botaoAdd(p)}</button></div>`);
  const sh = $("#sheet");

  msg && msg.addEventListener("input", e => { rascunho.cartao = e.target.value;

  sh.querySelectorAll("[data-q]").forEach(b => b.addEventListener("click", () => { rascunho.qtd = Math.max(1, Math.min(20, rascunho.qtd + Number(b.dataset.q)));
    sh.querySelector("#qv").textContent = rascunho.qtd; sh.querySelector("#add").textContent = botaoAdd(p); }));
  sh.querySelectorAll(".opt[data-v]").forEach(b => b.addEventListener("click", () => { const o = p.opcoes[Number(b.dataset.o)];
    rascunho.escolhas[o.nome] = b.dataset.v;
    sh.querySelectorAll(`.opt[data-o="${b.dataset.o}"]`).forEach(x => x.setAttribute("aria-pressed", x === b)); sh.querySelector("#optErr" + b.dataset.o).hidden = true;
    if (o.precos){ sh.querySelector("#tagP").textContent = brl(o.precos[b.dataset.v]); sh.querySelector("#add").textContent = botaoAdd(p); } }));
  sh.querySelector("#add").addEventListener("click", () => {
    let primeiro = null;
    (p.opcoes || []).forEach((o,oi) => { if (!rascunho.escolhas[o.nome]){ const er = sh.querySelector("#optErr" + oi); er.hidden = false; primeiro = primeiro || er; } });
    (p.textos || []).forEach((x,xi) => { const el = sh.querySelector("#txt" + xi), v = el.value.trim();
      if (v) rascunho.textos[x.nome] = v; else delete rascunho.textos[x.nome];
      if (x.obrigatorio && !v){ sh.querySelector("#txtErr" + xi).hidden = false; el.classList.add("inv"); primeiro = primeiro || el; } });
    if (primeiro){ primeiro.scrollIntoView({ block:"center" }); return; }
    const cartao = rascunho.cartao.trim();
    const assinatura = l => JSON.stringify([l.id, l.escolhas, l.textos, l.cartao]);
    const nova = { id, qtd: rascunho.qtd, escolhas: { ...rascunho.escolhas }, textos: { ...rascunho.textos }, cartao };
    const igual = sacola.find(l => assinatura(l) === assinatura(nova));
    if (igual) igual.qtd += nova.qtd; else sacola.push({ key: Date.now().toString(36) + Math.random().toString(36).slice(2,6), ...nova });
    salvaSacola(); fechaCamada(); anuncia(p.nome + " adicionado ao pedido");
  });
}

/* ---------- Sacola ---------- */
const subtotal = () => sacola.reduce((s,l) => s + (precoLinha(l) || 0) * l.qtd, 0);
const temOrcamento = () => sacola.some(l => precoLinha(l) == null);
const qtdTotal = () => sacola.reduce((s,l) => s + l.qtd, 0);
function atualizaBarra(){ const n = qtdTotal(); $("#bar").hidden = n === 0; $("#barN").textContent = n; $("#barT").textContent = brl(subtotal()) + (temOrcamento() ? " + orçamento" : ""); }
$("#abrirSacola").addEventListener("click", () => abreSacola());

function detalhesLinha(l){
  const d = []; Object.entries(l.escolhas || {}).forEach(([k,v]) => d.push(`${k}: ${v}`)); Object.entries(l.textos || {}).forEach(([k,v]) => d.push(`${k}: “${v}”`));
  if (l.opcao) d.push(l.opcao); return d;
}
function linhaHTML(l, editavel){
  const p = byId(l.id), pl = precoLinha(l), valor = pl == null ? "A combinar" : brl(pl * l.qtd);
  return `<div class="linha"><img src="${foto(p.id)}" alt="">
    <div><h3>${esc(p.nome)}</h3>
      ${detalhesLinha(l).map(d => `<p class="meta">${esc(d)}</p>`).join("")}
      ${l.cartao ? `<p class="msg">“${esc(l.cartao)}”</p>` : ""}
      ${editavel ? `<div class="acts"><div class="qtd"><button type="button" data-lq="-1" data-k="${l.key}" aria-label="Diminuir">−</button><span>${l.qtd}</span><button type="button" data-lq="1" data-k="${l.key}" aria-label="Aumentar">+</button></div><button class="rm" type="button" data-rm="${l.key}">Remover</button></div>` : `<p class="meta">${l.qtd}x ${pl == null ? "valor a combinar" : brl(pl)}</p>`}
    </div><strong class="${pl == null ? "comb" : ""}">${valor}</strong></div>`;
}
function freteTexto(){ if (dados.entrega.modalidade === "retirada") return "Sem frete"; return CONFIG.frete == null ? "A confirmar" : brl(CONFIG.frete); }
function totalTexto(){ const s = subtotal(), o = (temOrcamento() ? " + itens sob orçamento" : "") + (dados.pagamento.forma === CONFIG.cartaoComTaxa ? " + taxa do cartão" : "");
  if (dados.entrega.modalidade === "retirada") return brl(s) + o; return (CONFIG.frete == null ? brl(s) + " + frete" : brl(s + CONFIG.frete)) + o; }

}

function coletaEValida(){
  const sh = $("#sheet"), v = s => (sh.querySelector(s)?.value || "").trim();
  sh.querySelectorAll(".err").forEach(e => e.remove()); sh.querySelectorAll(".inv").forEach(e => { e.classList.remove("inv"); e.removeAttribute("aria-invalid"); });
  dados.comprador = { nome: v("#cNome"), tel: v("#cTel") };
  dados.presenteado = { nome: v("#pNome"), tel: v("#pTel"), surpresa: sh.querySelector("#surpresa").checked };
  Object.assign(dados.entrega, { data: v("#eData"), turno: v("#eTurno"), rua: v("#eRua"), num: v("#eNum"), comp: v("#eComp"), bairro: v("#eBairro"), ref: v("#eRef") });
  dados.pagamento = { forma: v("#pgForma"), troco: v("#pgTroco") };
  dados.obs = v("#obs"); dados.maior = !!sh.querySelector("#maior")?.checked;
  salvaDados();
  const erros = [];
  const erro = (sel, msg) => { const el = sh.querySelector(sel); el.classList.add("inv"); el.setAttribute("aria-invalid","true");
    const p = document.createElement("p"); p.className = "err"; p.textContent = msg; (el.type === "checkbox" ? el.parentElement : el).after(p); erros.push(el); };
  if (!dados.comprador.nome) erro("#cNome", "Informe seu nome.");
  if (dados.comprador.tel.replace(/\D/g,"").length < 10) erro("#cTel", "Informe um WhatsApp com DDD.");
  if (!dados.presenteado.nome) erro("#pNome", "Informe quem vai receber o presente.");
  const d = dados.entrega.data;
  if (!d) erro("#eData", "Escolha a data.");
  else if (d < hojeISO(CONFIG.antecedenciaDias)) erro("#eData", "Essa data não respeita a antecedência mínima.");
  else if (!diaPermitido(d)) erro("#eData", "Não entregamos nesse dia da semana. Entregamos " + nomesDias() + ".");
  if (!dados.entrega.turno) erro("#eTurno", "Escolha o turno.");
  if (dados.entrega.modalidade === "entrega"){
    if (!dados.entrega.rua) erro("#eRua", "Informe a rua.");
    if (!dados.entrega.num) erro("#eNum", "Informe o número.");
    if (!dados.entrega.bairro) erro("#eBairro", "Informe o bairro.");
  }
  if (!dados.pagamento.forma) erro("#pgForma", "Escolha a forma de pagamento.");
  if (temAlcool() && !dados.maior) erro("#maior", "Confirme a maioridade para pedidos com bebida alcoólica.");
  if (erros.length){ erros[0].focus(); erros[0].scrollIntoView({ block:"center" }); anuncia(erros.length + " campos precisam de atenção"); return false; }
  return true;
}

/* ---------- Mensagem do WhatsApp ---------- */
function montaMensagem(ped){
  const L = [], en = ped.entrega, t = turnoObj(en.turno);
  L.push(`🌿 *PEDIDO ${ped.numero}*`, `*${CONFIG.loja} | ${CONFIG.subtitulo}*`, "");
  L.push(`*Quem compra:* ${ped.comprador.nome}, ${ped.comprador.tel}`);
  L.push(`*Para quem:* ${ped.presenteado.nome}${ped.presenteado.tel ? `, ${ped.presenteado.tel}` : ""}`);
  if (ped.presenteado.surpresa) L.push("_Entrega surpresa: não ligar para quem vai receber_");
  L.push("");
  if (en.modalidade === "retirada") L.push(`*Retirada:* ${dataPorExtenso(en.data)}, ${t.nome.toLowerCase()} (${t.faixa})`, `*Local:* ${CONFIG.enderecoRetirada}`);
  else { L.push(`*Entrega:* ${dataPorExtenso(en.data)}, ${t.nome.toLowerCase()} (${t.faixa})`, `*Endereço:* ${enderecoTexto(en)}`); if (en.ref) L.push(`*Referência:* ${en.ref}`); }
  L.push("", "*Itens:*");
  ped.itens.forEach(i => {
    L.push(i.preco == null ? `${i.qtd}x ${i.nome}, valor sob orçamento` : `${i.qtd}x ${i.nome}, ${brl(i.preco * i.qtd)}${i.qtd > 1 ? ` (${brl(i.preco)} cada)` : ""}`);
    Object.entries(i.escolhas || {}).forEach(([k,v]) => L.push(`   ${k}: ${v}`));
    Object.entries(i.textos || {}).forEach(([k,v]) => L.push(`   ${k}: "${v}"`));
    if (i.cartao) L.push(`   Cartão: "${i.cartao}"`); });
  L.push("", `*Subtotal:* ${brl(ped.subtotal)}`, `*Frete:* ${ped.freteTexto === "A confirmar" ? "a confirmar pela loja" : ped.freteTexto === "Sem frete" ? "sem frete (retirada)" : ped.freteTexto}`, `*Total:* ${ped.totalTexto}`, "");
  L.push(`*Pagamento:* ${ped.pagamento.forma}${ped.pagamento.forma === CONFIG.cartaoComTaxa ? " (com taxa da maquininha, valor final a confirmar)" : ""}${ped.pagamento.troco ? `, troco para R$ ${ped.pagamento.troco}` : ""}`);
  if (ped.obs) L.push(`*Observações:* ${ped.obs}`);
  if (ped.maior) L.push("_Comprador confirmou ter 18 anos ou mais._");
  return L.join("\n");
}
const linkWhats = msg => "https://wa.me/" + (CONFIG.whatsapp || "") + "?text=" + encodeURIComponent(msg);

/* ---------- Número e registro do pedido ---------- */
// Dentro do Claude (ou abrindo o arquivo direto no computador) a planilha fica bloqueada: usa a numeração de teste.
const modoTeste = location.protocol === "file:" || /claude|anthropic/i.test(location.hostname);
const usaPlanilha = () => !!CONFIG.appsScriptUrl && !modoTeste;
const semAmbiguos = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const codigoContingencia = () => { const d = new Date(); const aammdd = String(d.getFullYear()).slice(2) + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
  let r = ""; const a = new Uint32Array(4); crypto.getRandomValues(a); a.forEach(n => r += semAmbiguos[n % semAmbiguos.length]); return `${CONFIG.prefixoPedido}-${aammdd}-${r}`; };

async function geraNumero(ped){
  if (usaPlanilha()){
    try{
      const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 6000);
      const r = await fetch(CONFIG.appsScriptUrl, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(ped), signal: ctrl.signal });
      clearTimeout(to); const j = await r.json();
      if (j && j.ok && j.numero) return { numero: j.numero, registro: "planilha" };
    }catch(e){}
    return { numero: codigoContingencia(), registro: "contingencia" };
  }
  // Modo demonstração: sequência guardada neste aparelho
  const n = store.get("cl_seq", 0) + 1; store.set("cl_seq", n);
  return { numero: `${CONFIG.prefixoPedido}-${String(n).padStart(4,"0")}`, registro: "aparelho" };
}

let enviando = false;
async function confirmaPedido(){
  if (enviando) return; enviando = true;
  const b = $("#confirmar"); b.disabled = true; b.textContent = "Gerando seu pedido...";
  const ped = {
    criadoEm: new Date().toISOString(),
    comprador: { ...dados.comprador }, presenteado: { ...dados.presenteado }, entrega: { ...dados.entrega, turnoTexto: turnoObj(dados.entrega.turno).nome + " (" + turnoObj(dados.entrega.turno).faixa + ")" },
    pagamento: { ...dados.pagamento }, obs: dados.obs, maior: temAlcool() ? dados.maior : false,
    itens: sacola.map(l => { const p = byId(l.id); return { id: p.id, nome: p.nome, preco: precoLinha(l), qtd: l.qtd, escolhas: l.escolhas || {}, textos: l.textos || {}, cartao: l.cartao }; }),
    subtotal: subtotal(), freteTexto: freteTexto(), totalTexto: totalTexto(), status: "Aguardando confirmação"
  };
  try{
    const r = await geraNumero(ped);
    ped.numero = r.numero; ped.registro = r.registro; ped.mensagem = montaMensagem(ped);
    const lista = store.get("cl_pedidos", []); lista.unshift(ped); store.set("cl_pedidos", lista);
    sacola = []; salvaSacola(); dados.entrega = { modalidade: dados.entrega.modalidade }; dados.pagamento = {}; dados.obs = ""; dados.presenteado = {}; dados.maior = false;
    abrePronto(ped);
  } finally { enviando = false; }
}

function abrePronto(ped){
  abreCamada(`${topo("Pedido gerado")}
    <div class="sheet-body">
      <div class="ok"><p>Seu número de pedido</p><div class="numero">${esc(ped.numero)}</div>
        <p>Falta só um passo: envie a mensagem no WhatsApp para a Capim Limão confirmar o pedido e o frete.</p></div>
      <details><summary class="dica" style="cursor:pointer">Ver mensagem que será enviada</summary><pre class="previa">${esc(ped.mensagem)}</pre></details>
    </div>
    <div class="sheet-foot"><a class="btn wa" href="${linkWhats(ped.mensagem)}" target="_blank" rel="noopener" data-autofocus>Enviar pedido pelo WhatsApp</a>
      <button class="btn sec" type="button" data-close>Voltar ao cardápio</button></div>`);
  anuncia("Pedido " + ped.numero + " gerado");
}

/* ---------- Painel de pedidos ---------- */
const STATUS = ["Aguardando confirmação","Confirmado","Em preparo","Saiu para entrega","Entregue","Cancelado"];
function abrePainel(){
  const lista = store.get("cl_pedidos", []);
  const origem = usaPlanilha() ? "Os pedidos também ficam registrados na planilha da loja." : "Versão de teste: os pedidos ficam registrados neste aparelho. Na versão final, cada pedido vai direto para uma planilha da loja, com numeração única para todos os clientes.";
  abreCamada(`${topo("Pedidos da loja")}
    <div class="sheet-body">
      <p class="demo">${origem}</p>
      ${lista.length ? lista.map((p,i) => `
        <article class="pedido">
          <header><strong>${esc(p.numero)}</strong><span class="meta">${new Date(p.criadoEm).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})}</span></header>
          <p class="meta" style="margin:.3rem 0">${esc(p.comprador.nome)} para ${esc(p.presenteado.nome)}. ${p.entrega.modalidade === "retirada" ? "Retirada" : "Entrega"} ${dataPorExtenso(p.entrega.data)}, ${esc(turnoObj(p.entrega.turno).nome.toLowerCase())}. ${esc(p.totalTexto)}</p>
          <div style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap">
            <label class="sr" for="st${i}">Status do pedido ${esc(p.numero)}</label>
            <select id="st${i}" data-st="${i}">${STATUS.map(s => `<option ${p.status === s ? "selected" : ""}>${s}</option>`).join("")}</select>
            <a class="rm" href="${linkWhats(p.mensagem)}" target="_blank" rel="noopener">Reenviar no WhatsApp</a>
          </div>
          <details><summary>Ver pedido completo</summary><pre class="previa">${esc(p.mensagem)}</pre></details>
        </article>`).join("") : `<div class="vazio-box"><p>Nenhum pedido ainda. Faça um pedido de teste pelo cardápio para ver como ele aparece aqui.</p></div>`}
    </div>
    ${lista.length ? `<div class="sheet-foot"><button class="btn sec" type="button" id="limpar">Apagar pedidos de teste</button></div>` : ""}`);
  const sh = $("#sheet");
  sh.querySelectorAll("[data-st]").forEach(s => s.addEventListener("change", () => { const l = store.get("cl_pedidos", []); l[Number(s.dataset.st)].status = s.value; store.set("cl_pedidos", l); anuncia("Status atualizado"); }));
  const lp = sh.querySelector("#limpar"); lp && lp.addEventListener("click", () => {
    if (lp.dataset.ok){ store.del("cl_pedidos"); store.del("cl_seq"); abrePainel(); } else { lp.dataset.ok = "1"; lp.textContent = "Toque de novo para apagar tudo"; } });
}
const ig = $("#insta"); if (CONFIG.instagram){ ig.href = "https://www.instagram.com/" + CONFIG.instagram + "/"; ig.textContent = "@" + CONFIG.instagram; } else ig.remove();
window.addEventListener("hashchange", () => { if (location.hash === "#pedidos") abrePainel(); });

/* ---------- Início ---------- */
renderMenu();
atualizaBarra();
if (location.hash === "#pedidos") abrePainel();
</script>
</body>
